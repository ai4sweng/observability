# OpenTelemetry Collector - AI4SWENG central ingestion gateway
# Receives OTLP from every KIO, fans out: metrics -> VictoriaMetrics, logs -> VictoriaLogs, traces -> Tempo.

# Bearer token auth on the OTLP receiver (contract/v2 guideline §1/§9.3).
# Real TLS is still deferred to a real remote/production deployment (see
# README's "V2 Guideline Değerlendirmesi" — this closes the "Bearer" half of
# "TLS + Bearer token", not the TLS half). Every KIO must now send
# OTEL_EXPORTER_OTLP_HEADERS="Authorization=Bearer <token>" matching
# OTLP_BEARER_TOKEN below or the collector rejects the call. Token value
# comes from this container's own env (set via docker-compose.yml, overridable
# through the repo-root .env / OTLP_BEARER_TOKEN).
extensions:
  bearertokenauth:
    token: "${env:OTLP_BEARER_TOKEN}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Metrics -> VictoriaMetrics via Prometheus remote_write.
  # resource_to_telemetry_conversion promotes resource attributes (kio.id, llm,
  # task_type, deployment.environment, service.version) to metric labels.
  prometheusremotewrite:
    endpoint: "http://victoriametrics:8428/api/v1/write"
    tls:
      insecure: true
    # Keep metric names clean: kio.request.count -> kio_request_count
    # (no _total / unit suffixes). Histograms still emit _bucket/_sum/_count.
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: true

  # Unstructured / string telemetry -> VictoriaLogs (native OTLP logs ingest).
  otlphttp/victorialogs:
    logs_endpoint: "http://victorialogs:9428/insert/opentelemetry/v1/logs"
    tls:
      insecure: true

  # Traces -> Tempo (native OTLP gRPC ingest on Tempo's distributor).
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Visibility into what flows through the collector (docker logs otel-collector).
  debug:
    verbosity: basic

service:
  extensions: [bearertokenauth]
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victorialogs, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
