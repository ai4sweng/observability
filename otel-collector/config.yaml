# OpenTelemetry Collector - AI4SWENG central ingestion gateway
# Receives OTLP from every KIO, fans out: metrics -> VictoriaMetrics, logs -> VictoriaLogs.
# Traces pipeline is wired but only debug-exported for now (Tempo/Jaeger deferred to phase 2).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Metrics -> VictoriaMetrics via Prometheus remote_write.
  # resource_to_telemetry_conversion promotes resource attributes (kio.id, llm,
  # task_type, deployment.environment, service.version) to metric labels.
  prometheusremotewrite:
    endpoint: "http://victoriametrics:8428/api/v1/write"
    tls:
      insecure: true
    # Keep metric names clean: kio.request.count -> kio_request_count
    # (no _total / unit suffixes). Histograms still emit _bucket/_sum/_count.
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: true

  # Unstructured / string telemetry -> VictoriaLogs (native OTLP logs ingest).
  otlphttp/victorialogs:
    logs_endpoint: "http://victorialogs:9428/insert/opentelemetry/v1/logs"
    tls:
      insecure: true

  # Visibility into what flows through the collector (docker logs otel-collector).
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victorialogs, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
