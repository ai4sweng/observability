# Tempo — monolithic mode, local disk storage. Local/dev use only.
# Verified against Tempo 2.x configuration reference (grafana.com/docs/tempo/latest/configuration/).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Cut blocks quickly so recently-ingested traces become queryable within seconds
  # (useful for a live demo; a production deployment would use a longer duration).
  max_block_duration: 1m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
