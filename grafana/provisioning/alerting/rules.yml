apiVersion: 1

# Contract §2.3: every KIO must publish a heartbeat (kio.heartbeat) every
# 60s. This rule flags a kio_id as "stale" (frozen / crashed / disconnected)
# once the time since its last heartbeat sample exceeds 120s (2x the
# heartbeat interval).
#
# Deliberate design decisions:
#  - Threshold 120s: HEARTBEAT_INTERVAL_S=60 (docker-compose.yml, all KIOs) —
#    120s tolerates a single missed heartbeat and fires on two consecutive
#    missed heartbeats.
#  - `for: 1m` — requires at least 1 minute of continuous violation so a
#    single delayed scrape doesn't false-alarm.
#  - No contact point / notification policy is defined here SEPARATELY:
#    Grafana's built-in default policy already routes to the
#    "grafana-default-email" contact point. Since this demo/pilot
#    environment has no real SMTP/Slack target, the rule only flips to
#    "Firing" in the Grafana Alerting UI (which serves the same purpose as
#    visual tracking via the panel/table) — if a real notification channel
#    is connected later (Slack/email), this rule sends notifications there
#    too automatically, with no changes required.
groups:
  - orgId: 1
    name: ai4sweng-stale-kio
    folder: AI4SWENG
    interval: 1m
    rules:
      - uid: ai4sweng-stale-kio-heartbeat
        title: "Stale KIO — heartbeat silence > 120s (Contract §2.3)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: time() - max by (kio_id) (timestamp(kio_heartbeat))
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 120
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: warning
          contract_ref: "§2.3"
        annotations:
          summary: "{{ $labels.kio_id }} has not published a heartbeat for the last 120 seconds (Contract §2.3 check)."
          description: "The kio.heartbeat metric has not been seen for this kio_id for longer than twice the expected 60s interval. The container may have crashed, lost network connectivity, or its NATS/timer loop may have stopped."
