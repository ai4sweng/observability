# AI4SWENG Observability Stack (local dev)
# Central Platform side: OTel Collector -> VictoriaMetrics (metrics) + VictoriaLogs (unstructured/string logs)
#                                        + Tempo (traces) -> Grafana
# Plus Langfuse (self-hosted, LLM-specific prompt/cost tracing, parallel to the OTel stream)
# Plus 2 KIO simulators (kio2-sim, kio7-sim) pushing contract-compliant dummy telemetry over OTLP/gRPC + Langfuse.
#
# Bring up:   docker compose up -d --build
# Grafana:    http://localhost:3000  (browse anonymously as Viewer; admin login
#             defaults to "admin" / "admin" — set GF_SECURITY_ADMIN_PASSWORD in
#             .env for any real/shared deployment.)
# Langfuse:   http://localhost:3001  (see LANGFUSE_INIT_USER_EMAIL / _PASSWORD below)
# Tear down:  docker compose down -v
#
# All passwords/keys and host ports below are overridable from a single
# repo-root .env file (see .env.example, already gitignored) via
# ${VAR:-default} — absent a .env, every default here is unchanged, so this
# file works out of the box exactly as before.

# Docker's default json-file driver never rotates, so every container's stdout
# (the KIO simulators log one line per simulated request) grows without bound
# under /var/lib/docker/containers. Capped at 3 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Ingestion gateway: single OTLP entrypoint for every KIO.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: ai4sweng-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      # Read by config.yaml's bearertokenauth extension (${env:OTLP_BEARER_TOKEN}).
      # Every KIO below sends this same token via OTEL_EXPORTER_OTLP_HEADERS —
      # change it here (or override OTLP_BEARER_TOKEN in a repo-root .env) and
      # it propagates everywhere, same pattern as the Langfuse keys/passwords.
      OTLP_BEARER_TOKEN: "${OTLP_BEARER_TOKEN:-local-dev-otlp-token}"
    volumes:
      - ./otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-5317}:4317"   # OTLP gRPC (host port; collector listens on 4317 internally)
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      - victoriametrics
      - victorialogs
      - tempo
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Metrics store (Prometheus-compatible, remote_write ingest).
  # ---------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    container_name: ai4sweng-victoriametrics
    command:
      - "--storageDataPath=/vmdata"
      - "--retentionPeriod=30d"
      - "--httpListenAddr=:8428"
    volumes:
      - vmdata:/vmdata
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Log store for unstructured / string telemetry (OTLP logs ingest).
  # ---------------------------------------------------------------------------
  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: ai4sweng-victorialogs
    command:
      - "--storageDataPath=/vldata"
      - "--retentionPeriod=30d"
      - "--httpListenAddr=:9428"
    volumes:
      - vldata:/vldata
    ports:
      - "${VICTORIALOGS_PORT:-9428}:9428"
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Trace store. Receives spans forwarded by the collector's traces pipeline.
  # Monolithic mode, local-disk backend — local/dev use only (see tempo/tempo.yaml).
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.10.5
    container_name: ai4sweng-tempo
    user: "0"   # simplest local-dev fix for local-disk volume permissions
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"   # Tempo query API (used by Grafana's Tempo datasource)
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Visualization. Datasources + dashboards provisioned from disk.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai4sweng-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      # Anonymous visitors are Viewers: anyone can browse the dashboards
      # without an account, but editing/deleting/alerting/datasources require
      # the admin login above.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - victoriametrics
      - victorialogs
      - tempo
    restart: unless-stopped
    logging: *default-logging

  # ===========================================================================
  # Metrics query API — parameterized read access to the operational telemetry
  # already in VictoriaMetrics, so an external caller can ask for
  # kio.request.duration_ms over the last hour without writing PromQL, knowing
  # the dotted-to-underscored name mangling, or knowing that a histogram's
  # average is rate(_sum)/rate(_count).
  #
  # Read-only and stateless: no ingest path, no database of its own, and it
  # never touches the KIOs. Safe to stop or remove without affecting anything
  # else in the stack.
  #
  # UNAUTHENTICATED BY DELIBERATE DECISION. The telemetry here is simulated
  # test data with nothing sensitive in it, and the VictoriaMetrics/
  # VictoriaLogs/Tempo read paths beside it are open as well, so this adds no
  # exposure that did not already exist. Revisit if real data ever flows
  # through this stack.
  # ===========================================================================
  metrics-api:
    build:
      context: .
      dockerfile: metrics_api/Dockerfile
    container_name: ai4sweng-metrics-api
    environment:
      VICTORIAMETRICS_URL: "http://victoriametrics:8428"
      VICTORIAMETRICS_TIMEOUT_S: "${METRICS_API_TIMEOUT_S:-10}"
      MAX_METRICS_PER_REQUEST: "${METRICS_API_MAX_METRICS:-10}"
    ports:
      - "${METRICS_API_PORT:-8081}:8081"
    depends_on:
      - victoriametrics
    restart: unless-stopped
    logging: *default-logging

  # ===========================================================================
  # Langfuse — second, parallel telemetry stream dedicated to LLM prompts/
  # completions/cost (evaluated against the v2 guideline, docs/design-decisions.md).
  # Self-hosted v3/v4-compatible stack: web + worker + postgres + clickhouse +
  # redis + minio. This is heavier than the rest of the stack on purpose — it's
  # Langfuse's own required footprint, not something we chose to add ourselves.
  # Host port 3000 is already taken by Grafana, so the Langfuse UI is published
  # on 3001 instead (container still listens on 3000 internally).
  # ===========================================================================
  postgres:
    image: docker.io/postgres:17
    container_name: ai4sweng-langfuse-postgres
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LANGFUSE_POSTGRES_PASSWORD:-8uFM7CaLqvYIH5pkutgnLPtm}"   # local-dev only, see README before real use
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server
    container_name: ai4sweng-langfuse-clickhouse
    restart: unless-stopped
    logging: *default-logging
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:-BxK0EmwznkyJ4lSkEXAMpt8D}"   # local-dev only
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
      # Disables the ClickHouse system log tables Langfuse never reads and caps
      # the rest (they grow on their own even with zero traffic), and shrinks
      # the server's own log files. See docs/data-retention.md.
      - ./langfuse/clickhouse/zz-ai4sweng-retention.xml:/etc/clickhouse-server/config.d/zz-ai4sweng-retention.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    container_name: ai4sweng-langfuse-minio
    restart: unless-stopped
    logging: *default-logging
    # Wrapper around `minio server` that also (re)applies the bucket lifecycle
    # rule expiring Langfuse's raw event files after LANGFUSE_EVENT_RETENTION_DAYS.
    # Without it every ingested event stays in MinIO forever as its own small
    # object — millions of files, which is what made `du` hang on the server.
    entrypoint: sh
    command: /usr/local/bin/minio-entrypoint.sh
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: "${LANGFUSE_MINIO_ROOT_PASSWORD:-b5jzlZ-NNeSu7q5Ix7-PtD6m}"   # local-dev only
      LANGFUSE_EVENT_RETENTION_DAYS: "${LANGFUSE_EVENT_RETENTION_DAYS:-3}"
    ports:
      - "${MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse_minio_data:/data
      - ./langfuse/minio-entrypoint.sh:/usr/local/bin/minio-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    container_name: ai4sweng-langfuse-redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      --requirepass ${LANGFUSE_REDIS_PASSWORD:-EQ_2-5L9BKy-rwiX96RsSwg8}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: ai4sweng-langfuse-worker
    restart: unless-stopped
    logging: *default-logging
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      # PUBLIC_HOST: the address a BROWSER uses to reach this machine — not
      # the Docker-internal network. Defaults to localhost (local-dev on the
      # same machine, Windows or Linux). Running the stack on a remote Ubuntu
      # server and opening the UI from a different machine? Set PUBLIC_HOST
      # in a repo-root .env file (see .env.example) to that server's
      # reachable IP/hostname, otherwise NextAuth callbacks/redirects below
      # and the media presigned URLs further down will point at the wrong
      # host and break (auth loop / broken images), even though core
      # tracing keeps working since that uses the internal `minio:9000`
      # address, unaffected by this.
      NEXTAUTH_URL: "http://${PUBLIC_HOST:-localhost}:${LANGFUSE_PORT:-3001}"
      DATABASE_URL: "postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-8uFM7CaLqvYIH5pkutgnLPtm}@postgres:5432/postgres"
      SALT: "${LANGFUSE_SALT:-c0882796a7b780c36201e7464099181f}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:-175f2c3e3adbb5d0b0a22a13d8be6cc2e855332cdc5f4001a42dfb7a9b81a1b6}"
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:-BxK0EmwznkyJ4lSkEXAMpt8D}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_ROOT_PASSWORD:-b5jzlZ-NNeSu7q5Ix7-PtD6m}"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      # Off: this ClickHouse table records every event file written above, only
      # so Langfuse's Enterprise-only data-retention job can later delete them.
      # We expire those files with a MinIO lifecycle rule instead (minio
      # service), so the table would just be one more thing growing forever.
      LANGFUSE_ENABLE_BLOB_STORAGE_FILE_LOG: "false"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_ROOT_PASSWORD:-b5jzlZ-NNeSu7q5Ix7-PtD6m}"
      # Presigned URLs consumed directly by the browser (not the container
      # network) — must resolve from wherever the browser sits, hence
      # PUBLIC_HOST/MINIO_PORT rather than the `minio` service name/port.
      # See NEXTAUTH_URL comment above.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "http://${PUBLIC_HOST:-localhost}:${MINIO_PORT:-9090}"
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: "${LANGFUSE_REDIS_PASSWORD:-EQ_2-5L9BKy-rwiX96RsSwg8}"
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    container_name: ai4sweng-langfuse-web
    restart: unless-stopped
    logging: *default-logging
    depends_on: *langfuse-depends-on
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-6a79d40fac2f5d085d8116cf720d2b3e5e4c1ce9043adbc2}"
      # Headless init: creates org/project/user/API-keys on first boot so the
      # KIO containers below can start pushing traces with no manual UI step.
      LANGFUSE_INIT_ORG_ID: ai4sweng
      LANGFUSE_INIT_ORG_NAME: AI4SWENG
      LANGFUSE_INIT_PROJECT_ID: ai4sweng-kio
      LANGFUSE_INIT_PROJECT_NAME: AI4SWENG KIO Telemetry
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_INIT_USER_EMAIL: admin@bitnet.com.tr
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD:-admin1234}"


  # ---------------------------------------------------------------------------
  # KIO simulators. Each is an independent module pushing dummy telemetry.
  # Every simulator's kio_id ends in "-sim" so it can never be mistaken for a
  # real KIO module reporting under the plain kioN id.
  # kio2-sim = code-analysis (emits real repo line/dir metrics), kio7-sim = random.
  # Each dual-writes: OTel (metrics/traces/logs) + Langfuse (LLM-specific).
  #
  # 2026-09: cut from six simulators (kio2-sim, kio3, kio4, kio7, kio8, kio13)
  # to two, to reduce the container count and Langfuse's disk growth (see
  # docs/data-retention.md). kio7-sim was kept because D1.1 Table 3 ties KIO7
  # to 13 of the 16 KPIs — its KIO page is the most complete one a single
  # simulator can populate. The dropped roles (nlp-requirements,
  # architecture-to-code, green-deploy, adoption) still exist in
  # kio_simulator.py; re-adding one is a copy of the kio7-sim block with a
  # different KIO_ID / KIO_TASK_TYPE / KIO_REAL_KPI_ROLE (docs/kio-simulators.md).
  #
  # Every KIO here is simulated/dummy by default (source=simulated) EXCEPT
  # kio2-sim's LLM-performance metrics when KIO2_REAL_LLM_ENABLED=true (real
  # Ollama + real GPU energy/temperature, source=real) — see the "Data
  # source" panel and README's real-vs-simulated data map for the full
  # picture, metric by metric.
  # ---------------------------------------------------------------------------
  # kio2-sim: simulator for KIO2 (bug locate & fix); the plain kio_id=kio2 is
  # reserved for the real module.
  # KIO2_REAL_LLM_ENABLED (default false, override via .env) switches its
  # LLM-performance metrics to a real local Ollama + real GPU energy — off by
  # default since it needs a native Ollama + GPU on the host
  # (docs/real-llm-integration.md).
  # KIO_REAL_KPI_ROLE=bugfix emits D1.1 KPIs 1.2, 6.1, 6.2 (+ slicing success
  # rate), always source=simulated regardless of KIO2_REAL_LLM_ENABLED.
  kio2-sim:
    build: ./kio-simulator
    container_name: ai4sweng-kio2-sim
    environment:
      KIO_ID: kio2-sim
      KIO_LLM: "qwen2.5:3b"
      KIO_TASK_TYPE: code-analysis
      SERVICE_VERSION: "1.2.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # Must match the collector's OTLP_BEARER_TOKEN (bearertokenauth extension,
      # otel-collector/config.yaml) or every OTLP export gets rejected.
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${OTLP_BEARER_TOKEN:-local-dev-otlp-token}"
      EXPORT_INTERVAL_MS: "${KIO_EXPORT_INTERVAL_MS:-15000}"
      HEARTBEAT_INTERVAL_S: "${KIO_HEARTBEAT_INTERVAL_S:-60}"
      REQUEST_INTERVAL_S: "${KIO2_REQUEST_INTERVAL_S:-3}"
      KIO_REAL_KPI_ROLE: "bugfix"
      KIO2_REAL_LLM_ENABLED: ${KIO2_REAL_LLM_ENABLED:-false}
      OLLAMA_ENDPOINT: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen2.5:3b"
      GPU_POWER_EXPORTER_URL: "http://host.docker.internal:9400/power"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_BASE_URL: "http://langfuse-web:3000"
      # Client-side trace sampling (Langfuse SDK). OTel metrics/logs/traces are
      # NOT sampled — only the Langfuse stream, which is what fills ClickHouse
      # and MinIO. See docs/data-retention.md for the growth figures.
      LANGFUSE_SAMPLE_RATE: "${KIO_LANGFUSE_SAMPLE_RATE:-0.2}"
    # host.docker.internal resolves automatically on Docker Desktop
    # (Windows/Mac); on native Linux Docker Engine it needs this explicit
    # mapping (host-gateway, supported since Docker Engine 20.10). Harmless
    # to keep on Docker Desktop too — same resolution either way.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector
    restart: unless-stopped
    logging: *default-logging

  # kio7-sim = simulator for D1.1's KIO7 (AI-SysDev); the plain kio_id=kio7
  # stays reserved for the real module, like kio2. D1.1 ties KIO7 to most
  # KPIs; only the ones where KIO7 is a clear primary owner (4.1, 5.1, 7.1,
  # 9.1, 9.2) are simulated. Uses claude-sonnet
  # as its nominal LLM (cost/energy coefficients already defined in
  # kio_simulator.py's LLM_COST_PER_1K / LLM_JOULES_PER_TOKEN).
  kio7-sim:
    build: ./kio-simulator
    container_name: ai4sweng-kio7-sim
    environment:
      KIO_ID: kio7-sim
      KIO_LLM: "claude-sonnet"
      KIO_TASK_TYPE: ai-sysdev
      SERVICE_VERSION: "0.5.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # Must match the collector's OTLP_BEARER_TOKEN (bearertokenauth extension,
      # otel-collector/config.yaml) or every OTLP export gets rejected.
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${OTLP_BEARER_TOKEN:-local-dev-otlp-token}"
      EXPORT_INTERVAL_MS: "${KIO_EXPORT_INTERVAL_MS:-15000}"
      HEARTBEAT_INTERVAL_S: "${KIO_HEARTBEAT_INTERVAL_S:-60}"
      REQUEST_INTERVAL_S: "${KIO7_REQUEST_INTERVAL_S:-5}"
      # D1.1 KPI 4.1 (Developer productivity), 5.1 (Time-to-market),
      # 7.1 (Annual cost saving), 9.1 (Refactoring reduction), 9.2
      # (Technical debt reduction), simulated — shown on the KIO7 dashboard
      # (kio_id=kio7-sim, same as kio2-sim on the KIO2 page), see
      # docs/report/KPI_Metrik_Referansi_v1.3.docx.
      KIO_REAL_KPI_ROLE: "ai-sysdev"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_BASE_URL: "http://langfuse-web:3000"
      # Client-side trace sampling (Langfuse SDK). OTel metrics/logs/traces are
      # NOT sampled — only the Langfuse stream, which is what fills ClickHouse
      # and MinIO. See docs/data-retention.md for the growth figures.
      LANGFUSE_SAMPLE_RATE: "${KIO_LANGFUSE_SAMPLE_RATE:-0.2}"
    depends_on:
      - otel-collector
    restart: unless-stopped
    logging: *default-logging

volumes:
  vmdata:
  vldata:
  tempodata:
  grafana-data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
