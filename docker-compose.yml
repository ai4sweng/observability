# AI4SWENG Observability Stack (local dev)
# Central Platform side: OTel Collector -> VictoriaMetrics (metrics) + VictoriaLogs (unstructured/string logs)
#                                        + Tempo (traces) -> Grafana
# Plus Langfuse (self-hosted, LLM-specific prompt/cost tracing, parallel to the OTel stream)
# Plus 3 KIO simulators pushing contract-compliant dummy telemetry over OTLP/gRPC + Langfuse.
#
# Bring up:   docker compose up -d --build
# Grafana:    http://localhost:3000  (admin / admin)
# Langfuse:   http://localhost:3001  (see LANGFUSE_INIT_USER_EMAIL / _PASSWORD below)
# Tear down:  docker compose down -v
#
# All passwords/keys and host ports below are overridable from a single
# repo-root .env file (see .env.example, already gitignored) via
# ${VAR:-default} — absent a .env, every default here is unchanged, so this
# file works out of the box exactly as before.

services:
  # ---------------------------------------------------------------------------
  # Ingestion gateway: single OTLP entrypoint for every KIO.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: ai4sweng-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      - victoriametrics
      - victorialogs
      - tempo
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Metrics store (Prometheus-compatible, remote_write ingest).
  # ---------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    container_name: ai4sweng-victoriametrics
    command:
      - "--storageDataPath=/vmdata"
      - "--retentionPeriod=30d"
      - "--httpListenAddr=:8428"
    volumes:
      - vmdata:/vmdata
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Log store for unstructured / string telemetry (OTLP logs ingest).
  # ---------------------------------------------------------------------------
  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: ai4sweng-victorialogs
    command:
      - "--storageDataPath=/vldata"
      - "--retentionPeriod=30d"
      - "--httpListenAddr=:9428"
    volumes:
      - vldata:/vldata
    ports:
      - "${VICTORIALOGS_PORT:-9428}:9428"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Trace store. Receives spans forwarded by the collector's traces pipeline.
  # Monolithic mode, local-disk backend — local/dev use only (see tempo/tempo.yaml).
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.10.5
    container_name: ai4sweng-tempo
    user: "0"   # simplest local-dev fix for local-disk volume permissions
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"   # Tempo query API (used by Grafana's Tempo datasource)
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Visualization. Datasources + dashboards provisioned from disk.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai4sweng-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - victoriametrics
      - victorialogs
      - tempo
    restart: unless-stopped

  # ===========================================================================
  # Langfuse — second, parallel telemetry stream dedicated to LLM prompts/
  # completions/cost (per senior's request, evaluated against v2 guideline).
  # Self-hosted v3/v4-compatible stack: web + worker + postgres + clickhouse +
  # redis + minio. This is heavier than the rest of the stack on purpose — it's
  # Langfuse's own required footprint, not something we chose to add ourselves.
  # Host port 3000 is already taken by Grafana, so the Langfuse UI is published
  # on 3001 instead (container still listens on 3000 internally).
  # ===========================================================================
  postgres:
    image: docker.io/postgres:17
    container_name: ai4sweng-langfuse-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LANGFUSE_POSTGRES_PASSWORD:-8uFM7CaLqvYIH5pkutgnLPtm}"   # local-dev only, see README before real use
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server
    container_name: ai4sweng-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:-BxK0EmwznkyJ4lSkEXAMpt8D}"   # local-dev only
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    container_name: ai4sweng-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: "${LANGFUSE_MINIO_ROOT_PASSWORD:-b5jzlZ-NNeSu7q5Ix7-PtD6m}"   # local-dev only
    ports:
      - "${MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    container_name: ai4sweng-langfuse-redis
    restart: unless-stopped
    command: >
      --requirepass ${LANGFUSE_REDIS_PASSWORD:-EQ_2-5L9BKy-rwiX96RsSwg8}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: ai4sweng-langfuse-worker
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      # PUBLIC_HOST: the address a BROWSER uses to reach this machine — not
      # the Docker-internal network. Defaults to localhost (local-dev on the
      # same machine, Windows or Linux). Running the stack on a remote Ubuntu
      # server and opening the UI from a different machine? Set PUBLIC_HOST
      # in a repo-root .env file (see .env.example) to that server's
      # reachable IP/hostname, otherwise NextAuth callbacks/redirects below
      # and the media presigned URLs further down will point at the wrong
      # host and break (auth loop / broken images), even though core
      # tracing keeps working since that uses the internal `minio:9000`
      # address, unaffected by this.
      NEXTAUTH_URL: "http://${PUBLIC_HOST:-localhost}:${LANGFUSE_PORT:-3001}"
      DATABASE_URL: "postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-8uFM7CaLqvYIH5pkutgnLPtm}@postgres:5432/postgres"
      SALT: "${LANGFUSE_SALT:-c0882796a7b780c36201e7464099181f}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:-175f2c3e3adbb5d0b0a22a13d8be6cc2e855332cdc5f4001a42dfb7a9b81a1b6}"
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:-BxK0EmwznkyJ4lSkEXAMpt8D}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_ROOT_PASSWORD:-b5jzlZ-NNeSu7q5Ix7-PtD6m}"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_ROOT_PASSWORD:-b5jzlZ-NNeSu7q5Ix7-PtD6m}"
      # Presigned URLs consumed directly by the browser (not the container
      # network) — must resolve from wherever the browser sits, hence
      # PUBLIC_HOST/MINIO_PORT rather than the `minio` service name/port.
      # See NEXTAUTH_URL comment above.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "http://${PUBLIC_HOST:-localhost}:${MINIO_PORT:-9090}"
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: "${LANGFUSE_REDIS_PASSWORD:-EQ_2-5L9BKy-rwiX96RsSwg8}"
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    container_name: ai4sweng-langfuse-web
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-6a79d40fac2f5d085d8116cf720d2b3e5e4c1ce9043adbc2}"
      # Headless init: creates org/project/user/API-keys on first boot so the
      # KIO containers below can start pushing traces with no manual UI step.
      LANGFUSE_INIT_ORG_ID: ai4sweng
      LANGFUSE_INIT_ORG_NAME: AI4SWENG
      LANGFUSE_INIT_PROJECT_ID: ai4sweng-kio
      LANGFUSE_INIT_PROJECT_NAME: AI4SWENG KIO Telemetry
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_INIT_USER_EMAIL: admin@bitnet.com.tr
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD:-admin1453}"

  # ===========================================================================
  # Orchestration layer (v2 guideline, now implemented — see
  # "V2 Guideline Değerlendirmesi" in README.md for the scope/decisions).
  # Workflow API -> Session Manager (Postgres) -> Planner -> NATS JetStream ->
  # worker KIO -> NATS (result) -> Planner -> Session Manager (lineage).
  # This is how KIOs get *triggered*; it is deliberately separate from, and
  # does not replace, the OTel/Langfuse observability pipeline above — a
  # worker KIO still reports its own telemetry the same way regardless of
  # whether it was triggered by NATS or by its own internal loop.
  # ===========================================================================
  nats:
    image: nats:2.10-alpine
    container_name: ai4sweng-nats
    command: ["-js", "-m", "8222"]   # -js enables JetStream persistence
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"   # client connections
      - "${NATS_MONITOR_PORT:-8222}:8222"   # HTTP monitoring (http://localhost:8222/varz)
    volumes:
      - natsdata:/data
    restart: unless-stopped

  orchestrator-postgres:
    image: postgres:16-alpine
    container_name: ai4sweng-orchestrator-postgres
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: "${ORCHESTRATOR_POSTGRES_PASSWORD:-orchestrator}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - orchestrator_postgres_data:/var/lib/postgresql/data
      - ./orchestrator/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  workflow-api:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: ai4sweng-workflow-api
    environment:
      NATS_URL: "nats://nats:4222"
      SESSION_DB_DSN: "postgresql+psycopg2://orchestrator:${ORCHESTRATOR_POSTGRES_PASSWORD:-orchestrator}@orchestrator-postgres:5432/orchestrator"
    ports:
      - "${WORKFLOW_API_PORT:-8080}:8080"   # POST /workflow/run, GET /workflow/{session_id}
    depends_on:
      nats:
        condition: service_started
      orchestrator-postgres:
        condition: service_healthy
    restart: unless-stopped

  planner:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: ai4sweng-planner
    command: ["python", "-m", "orchestrator.planner"]
    environment:
      NATS_URL: "nats://nats:4222"
      SESSION_DB_DSN: "postgresql+psycopg2://orchestrator:${ORCHESTRATOR_POSTGRES_PASSWORD:-orchestrator}@orchestrator-postgres:5432/orchestrator"
    depends_on:
      nats:
        condition: service_started
      orchestrator-postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # KIO simulators. Each is an independent module pushing dummy telemetry.
  # kio2-sim = code-analysis (emits real repo line/dir metrics), kio3/kio4 = random.
  # Each now dual-writes: OTel (metrics/traces/logs) + Langfuse (LLM-specific).
  #
  # kio3/kio4 ALSO consume dispatched tasks from NATS (NATS_ENABLED=true) — see
  # "NATS tüketici modu" in kio_simulator.py — but this is now an ADDITIONAL
  # trigger path on top of their own internal timer, not a replacement for it.
  # First cut of the NATS integration made it either/or: with nothing actually
  # calling the Workflow API, kio3/kio4 went completely silent ("No data" on
  # every panel). Fixed 2026-08 (kio_simulator.py's main() now always starts
  # the internal timer thread regardless of NATS_ENABLED).
  #
  # Every KIO here is simulated/dummy by default (source=simulated) EXCEPT
  # kio2-sim's LLM-performance metrics when KIO2_REAL_LLM_ENABLED=true (real
  # Ollama + real GPU energy/temperature, source=real) — see the "Veri
  # kaynağı" panel and README's real-vs-simulated data map for the full
  # picture, metric by metric.
  # ---------------------------------------------------------------------------
  # kio2-sim: the ORIGINAL simulator, kept running in parallel as a contract
  # baseline / comparison reference now that the real FocusTracer module will
  # eventually take over kio_id=kio2 (see kio2-integration/README.md).
  # KIO2_REAL_LLM_ENABLED defaults to false (override via .env, see
  # .env.example) — the real-Ollama/real-GPU-energy path works independently
  # of whether FocusTracer has connected yet, so it's available to flip on
  # any time (e.g. for a demo) without waiting for that handoff; it stays off
  # by default since it needs a native Ollama + GPU on the host, which a
  # headless remote test server typically doesn't have.
  # KIO_REAL_KPI_ROLE is back ON ("bugfix", 2026-08) too: the D1.1 KPI panels
  # (bug-fix time, issue resolution time, slicing success rate, customer-
  # reported issues) were sitting on permanent "No data" with it empty, which
  # read as broken rather than "not yet connected". These four KPIs are always
  # source=simulated regardless of KIO2_REAL_LLM_ENABLED — FocusTracer would
  # have to report them for real, there is no real variant of them here yet.
  kio2-sim:
    build: ./kio-simulator
    container_name: ai4sweng-kio2-sim
    environment:
      KIO_ID: kio2-sim
      KIO_LLM: "qwen2.5:3b"
      KIO_TASK_TYPE: code-analysis
      SERVICE_VERSION: "1.2.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      EXPORT_INTERVAL_MS: "${KIO_EXPORT_INTERVAL_MS:-5000}"
      HEARTBEAT_INTERVAL_S: "${KIO_HEARTBEAT_INTERVAL_S:-60}"
      REQUEST_INTERVAL_S: "${KIO2_REQUEST_INTERVAL_S:-3}"
      KIO_REAL_KPI_ROLE: "bugfix"
      KIO2_REAL_LLM_ENABLED: ${KIO2_REAL_LLM_ENABLED:-false}
      OLLAMA_ENDPOINT: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen2.5:3b"
      GPU_POWER_EXPORTER_URL: "http://host.docker.internal:9400/power"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_BASE_URL: "http://langfuse-web:3000"
    # host.docker.internal resolves automatically on Docker Desktop
    # (Windows/Mac); on native Linux Docker Engine it needs this explicit
    # mapping (host-gateway, supported since Docker Engine 20.10). Harmless
    # to keep on Docker Desktop too — same resolution either way.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector
    restart: unless-stopped

  # kio2: reserved for the REAL FocusTracer module. Not started from here —
  # FocusTracer runs as its own process/container per kio2-integration/README.md
  # (same docker-compose network, or a separate machine via remote-kio-style
  # OTEL_EXPORTER_OTLP_ENDPOINT). Nothing to bring up on this side; this
  # comment just documents the reserved kio_id so it isn't reused elsewhere.

  # kio3 = D1.1's KIO3 (NLP -> Formal Requirements). Was labeled task_type
  # "test-generation" before D1.1 KPI mapping was cross-checked — renamed
  # 2026-08 to match D1.1's actual KIO3 identity, since the D1.1 traceability
  # matrix's KPI assignments (1.1, 3.1) are keyed to the real KIO3 role, not
  # to whatever arbitrary task_type this simulator happened to use first.
  kio3:
    build: ./kio-simulator
    container_name: ai4sweng-kio3
    environment:
      KIO_ID: kio3
      KIO_LLM: "llama3.1:8b"
      KIO_TASK_TYPE: nlp-requirements
      SERVICE_VERSION: "0.9.1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      EXPORT_INTERVAL_MS: "${KIO_EXPORT_INTERVAL_MS:-5000}"
      HEARTBEAT_INTERVAL_S: "${KIO_HEARTBEAT_INTERVAL_S:-60}"
      REQUEST_INTERVAL_S: "${KIO3_REQUEST_INTERVAL_S:-2}"
      # NATS-driven: tasks ALSO arrive via kio.tasks.kio3 (published by the
      # Planner) on top of this KIO's own internal timer (see kio_simulator.py
      # main() — NATS is an additional trigger path, not a replacement).
      NATS_ENABLED: "true"
      NATS_URL: "nats://nats:4222"
      # D1.1 KPI 1.1 (Code generation speed) + 3.1 (Code quality improvement),
      # simulated — see docs/AI4SWENG_KPI_Metrik_Referansi_v1.1.docx Bölüm 5.
      KIO_REAL_KPI_ROLE: "nlp-requirements"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_BASE_URL: "http://langfuse-web:3000"
    depends_on:
      - otel-collector
      - nats
    restart: unless-stopped

  # kio4 = D1.1's KIO4 (Architecture-to-Code Planner). Was labeled task_type
  # "debug" before the same D1.1 cross-check — renamed 2026-08, see kio3's
  # comment above for the rationale.
  kio4:
    build: ./kio-simulator
    container_name: ai4sweng-kio4
    environment:
      KIO_ID: kio4
      KIO_LLM: "gpt-4o-mini"
      KIO_TASK_TYPE: architecture-to-code
      SERVICE_VERSION: "2.0.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      EXPORT_INTERVAL_MS: "${KIO_EXPORT_INTERVAL_MS:-5000}"
      HEARTBEAT_INTERVAL_S: "${KIO_HEARTBEAT_INTERVAL_S:-60}"
      REQUEST_INTERVAL_S: "${KIO4_REQUEST_INTERVAL_S:-4}"
      NATS_ENABLED: "true"
      NATS_URL: "nats://nats:4222"
      # D1.1 KPI 1.1 + 3.1 (shared with kio3) + 3.2 (Review score increase,
      # KIO4-only), simulated.
      KIO_REAL_KPI_ROLE: "architecture-to-code"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_BASE_URL: "http://langfuse-web:3000"
    depends_on:
      - otel-collector
      - nats
    restart: unless-stopped

  # kio7 = D1.1's KIO7 (AI-SysDev). D1.1 ties KIO7 to most KPIs; only the
  # ones where KIO7 is a clear primary owner (4.1, 5.1, 7.1, 9.1, 9.2 — not
  # already covered by kio2-sim/kio3/kio4) are simulated. Uses claude-sonnet
  # as its nominal LLM (cost/energy coefficients already defined in
  # kio_simulator.py's LLM_COST_PER_1K / LLM_JOULES_PER_TOKEN).
  kio7:
    build: ./kio-simulator
    container_name: ai4sweng-kio7
    environment:
      KIO_ID: kio7
      KIO_LLM: "claude-sonnet"
      KIO_TASK_TYPE: ai-sysdev
      SERVICE_VERSION: "0.5.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      EXPORT_INTERVAL_MS: "${KIO_EXPORT_INTERVAL_MS:-5000}"
      HEARTBEAT_INTERVAL_S: "${KIO_HEARTBEAT_INTERVAL_S:-60}"
      REQUEST_INTERVAL_S: "${KIO7_REQUEST_INTERVAL_S:-5}"
      NATS_ENABLED: "true"
      NATS_URL: "nats://nats:4222"
      # D1.1 KPI 4.1 (Developer productivity), 5.1 (Time-to-market),
      # 7.1 (Annual cost saving), 9.1 (Refactoring reduction), 9.2
      # (Technical debt reduction), simulated — see
      # docs/AI4SWENG_KPI_Metrik_Referansi_v1.3.docx.
      KIO_REAL_KPI_ROLE: "ai-sysdev"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_BASE_URL: "http://langfuse-web:3000"
    depends_on:
      - otel-collector
      - nats
    restart: unless-stopped

  # kio8 = D1.1's KIO8 (Cross-Architecture / Energy-Efficient Deploy). D1.1
  # ties KIO8 to KPI 2.1/2.2 (energy, shared with KIO7/KIO10) and uniquely to
  # KPI 8.3 (Cross-Architecture Build Success Rate). Pure D1.1-KPI simulator
  # like kio7 — NATS left off since there's no real dispatch target behind it
  # yet (see orchestrator's task_type routing table).
  kio8:
    build: ./kio-simulator
    container_name: ai4sweng-kio8
    environment:
      KIO_ID: kio8
      KIO_LLM: "gemini-1.5-pro"
      KIO_TASK_TYPE: green-deploy
      SERVICE_VERSION: "0.3.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      EXPORT_INTERVAL_MS: "${KIO_EXPORT_INTERVAL_MS:-5000}"
      HEARTBEAT_INTERVAL_S: "${KIO_HEARTBEAT_INTERVAL_S:-60}"
      REQUEST_INTERVAL_S: "${KIO8_REQUEST_INTERVAL_S:-5}"
      # D1.1 KPI 2.1 (Lifecycle energy reduction), 2.2 (Deployment energy
      # efficiency), 8.3 (Cross-Architecture Build Success Rate), simulated —
      # see docs/AI4SWENG_KPI_Metrik_Referansi_v1.3.docx.
      KIO_REAL_KPI_ROLE: "green-deploy"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_BASE_URL: "http://langfuse-web:3000"
    depends_on:
      - otel-collector
    restart: unless-stopped

  # kio13 = D1.1's KIO13 (Adoption & Usage Tracking) — the sole owner of KPI
  # 8.1 (Adoption rate) and KPI 8.2 (Active usage & satisfaction), D1.1's
  # only two KPIs mapped to a single KIO with no co-owner.
  kio13:
    build: ./kio-simulator
    container_name: ai4sweng-kio13
    environment:
      KIO_ID: kio13
      KIO_LLM: "gpt-4o-mini"
      KIO_TASK_TYPE: adoption
      SERVICE_VERSION: "0.3.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      EXPORT_INTERVAL_MS: "${KIO_EXPORT_INTERVAL_MS:-5000}"
      HEARTBEAT_INTERVAL_S: "${KIO_HEARTBEAT_INTERVAL_S:-60}"
      REQUEST_INTERVAL_S: "${KIO13_REQUEST_INTERVAL_S:-5}"
      # D1.1 KPI 8.1 (Adoption rate), 8.2 (Active usage & satisfaction),
      # simulated — see docs/AI4SWENG_KPI_Metrik_Referansi_v1.3.docx.
      KIO_REAL_KPI_ROLE: "adoption"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-724e64325a5bb595077226d8129117fd}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-484c3829fc7dd2b09018278cc02f5318}"
      LANGFUSE_BASE_URL: "http://langfuse-web:3000"
    depends_on:
      - otel-collector
    restart: unless-stopped

